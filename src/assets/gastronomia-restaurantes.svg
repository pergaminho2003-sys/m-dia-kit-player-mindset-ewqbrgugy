<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgNight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="40%" stop-color="#221e25" />
      <stop offset="100%" stop-color="#3d2a1d" />
    </linearGradient>

    <linearGradient id="yellowWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c227" />
      <stop offset="60%" stop-color="#e0a010" />
      <stop offset="100%" stop-color="#ad7208" />
    </linearGradient>

    <!-- Warm lantern glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cc" stop-opacity="1" />
      <stop offset="30%" stop-color="#ffb834" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#e57a1b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1a120b" stop-opacity="0" />
    </radialGradient>

    <!-- Thatch roof texture -->
    <linearGradient id="thatchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3722" />
      <stop offset="50%" stop-color="#694f31" />
      <stop offset="100%" stop-color="#2d1f12" />
    </linearGradient>

    <!-- Wooden table -->
    <linearGradient id="tableWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e1b10" />
      <stop offset="30%" stop-color="#472b1a" />
      <stop offset="70%" stop-color="#3a2214" />
      <stop offset="100%" stop-color="#26160d" />
    </linearGradient>

    <!-- Terracotta blouse -->
    <linearGradient id="blouseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#db5a3e" />
      <stop offset="50%" stop-color="#c44326" />
      <stop offset="100%" stop-color="#993019" />
    </linearGradient>

    <!-- Skin tone -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd5b8" />
      <stop offset="50%" stop-color="#f8c3a0" />
      <stop offset="100%" stop-color="#e2a580" />
    </linearGradient>

    <!-- Hair -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211717" />
      <stop offset="50%" stop-color="#181111" />
      <stop offset="100%" stop-color="#0d0909" />
    </linearGradient>

    <!-- Pineapple exterior -->
    <linearGradient id="pineappleSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#687820" />
      <stop offset="40%" stop-color="#9a7c1b" />
      <stop offset="70%" stop-color="#7a4e13" />
      <stop offset="100%" stop-color="#4a2e0a" />
    </linearGradient>

    <!-- Creamy shrimp filling -->
    <linearGradient id="creamyShrimp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5dc" />
      <stop offset="40%" stop-color="#fedaa2" />
      <stop offset="80%" stop-color="#f5ba78" />
      <stop offset="100%" stop-color="#e89552" />
    </linearGradient>

    <!-- Tomato rose -->
    <radialGradient id="tomatoRose" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff4a36" />
      <stop offset="60%" stop-color="#d61f0e" />
      <stop offset="100%" stop-color="#8a0f03" />
    </radialGradient>

    <!-- Rice bowl -->
    <linearGradient id="riceBowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e9edf0" />
      <stop offset="100%" stop-color="#c7d0d6" />
    </linearGradient>
  </defs>

  <!-- Base background (Night outdoor restaurant scene) -->
  <rect width="1200" height="800" fill="url(#bgNight)" />

  <!-- Outdoor village stroll walkway on left -->
  <path d="M 0 200 L 400 280 L 350 560 L 0 560 Z" fill="#2b2326" opacity="0.8" />
  <ellipse cx="140" cy="380" rx="40" ry="15" fill="#4d3b3c" opacity="0.4" />
  <ellipse cx="260" cy="420" rx="60" ry="20" fill="#4d3b3c" opacity="0.3" />
  <!-- Distant night silhouettes -->
  <circle cx="280" cy="360" r="14" fill="#1f181d" />
  <path d="M 270 374 L 290 374 L 295 430 L 265 430 Z" fill="#1f181d" />

  <!-- Warm Yellow Colonial Wall on Right -->
  <path d="M 680 140 L 1200 100 L 1200 620 L 750 620 Z" fill="url(#yellowWall)" />

  <!-- Wall perspective shadows & moldings -->
  <path d="M 680 140 L 750 620 L 725 620 L 660 140 Z" fill="#8f5b04" opacity="0.6" />
  <path d="M 1020 180 L 1180 180 L 1180 440 L 1020 440 Z" fill="#ffffff" opacity="0.15" />
  <!-- White colonial window curtain -->
  <path d="M 1030 190 Q 1060 300 1040 430 L 1110 430 Q 1100 280 1130 190 Z" fill="#ffffff" opacity="0.75" />

  <!-- Rustic wall lantern on yellow wall -->
  <circle cx="920" cy="270" r="180" fill="url(#lanternGlow)" />
  <!-- Lantern structure -->
  <path d="M 900 230 L 940 230 L 950 280 L 890 280 Z" fill="#fff9d6" opacity="0.9" />
  <polygon points="895,220 945,220 955,230 885,230" fill="#2b1a09" />
  <polygon points="885,230 955,230 945,290 895,290" fill="none" stroke="#2b1a09" stroke-width="5" />
  <line x1="920" y1="230" x2="920" y2="290" stroke="#2b1a09" stroke-width="4" />
  <polygon points="895,290 945,290 920,320" fill="#2b1a09" />
  <path d="M 920 220 L 920 180 L 950 180" fill="none" stroke="#2b1a09" stroke-width="6" />

  <!-- Thatched roof canopy overhead -->
  <path d="M 0 0 L 1200 0 L 1200 130 L 700 160 L 0 200 Z" fill="url(#thatchGrad)" />
  <!-- Thatch fringe details -->
  <path d="M 0 195 Q 40 225 80 190 Q 130 230 180 185 Q 230 225 280 180 Q 340 225 400 180 Q 460 220 520 175 Q 600 210 680 160 L 1200 120 L 1200 0 L 0 0 Z" fill="#543c22" opacity="0.85" />
  <!-- Wooden roof beam -->
  <path d="M 200 0 L 260 0 L 680 180 L 640 185 Z" fill="#261608" opacity="0.9" />

  <!-- Rafaela (Creator) seated at the table -->
  <!-- Left shoulder & arm resting on table/chair -->
  <path d="M 280 470 C 230 480 180 540 160 620 L 290 620 Z" fill="url(#skinGrad)" />

  <!-- Torso & Terracotta sleeveless top -->
  <path d="M 440 460 C 400 470 360 510 350 580 C 370 650 480 660 680 650 C 720 580 720 510 680 470 C 650 470 600 480 560 520 C 520 480 470 470 440 460 Z" fill="url(#blouseGrad)" />
  <!-- V-neckline & chest -->
  <path d="M 460 465 Q 560 540 660 470 Q 560 610 460 465 Z" fill="url(#skinGrad)" />
  <!-- Small round pin/badge on her strap -->
  <circle cx="680" cy="515" r="14" fill="#1c242b" stroke="#7a8b99" stroke-width="2" />
  <circle cx="680" cy="515" r="5" fill="#3dd980" />

  <!-- Right shoulder & arm extended toward table/chair -->
  <path d="M 680 470 C 740 480 840 500 900 520 L 900 560 C 830 540 760 530 710 520 Z" fill="url(#skinGrad)" />

  <!-- Neck -->
  <path d="M 505 400 L 505 470 Q 560 485 615 470 L 615 400 Z" fill="url(#skinGrad)" />

  <!-- Hair (Dark brunette with soft waves, falling over left shoulder) -->
  <path d="M 420 310 C 380 340 370 410 380 470 C 390 530 430 580 450 630 C 470 640 440 540 440 490 C 440 420 460 380 470 330 Z" fill="url(#hairGrad)" />
  <path d="M 450 280 C 440 210 520 160 620 170 C 710 180 720 250 710 320 C 700 370 690 430 670 460 C 660 380 660 310 630 260 C 570 230 480 230 450 280 Z" fill="url(#hairGrad)" />

  <!-- Face -->
  <path d="M 475 285 C 470 360 490 425 560 430 C 630 425 655 360 650 285 C 645 220 480 220 475 285 Z" fill="url(#skinGrad)" />

  <!-- Soft cheek blush & warm lighting from lantern -->
  <ellipse cx="610" cy="340" rx="28" ry="18" fill="#e88264" opacity="0.4" />
  <ellipse cx="510" cy="340" rx="28" ry="18" fill="#e88264" opacity="0.3" />

  <!-- Eyebrows -->
  <path d="M 490 280 Q 520 270 540 282" fill="none" stroke="#2b1a11" stroke-width="5" stroke-linecap="round" />
  <path d="M 580 282 Q 605 270 635 280" fill="none" stroke="#2b1a11" stroke-width="5" stroke-linecap="round" />

  <!-- Eyes (Happy, expressive eyes) -->
  <ellipse cx="515" cy="300" rx="14" ry="9" fill="#ffffff" />
  <circle cx="517" cy="300" r="7" fill="#382417" />
  <circle cx="519" cy="298" r="2.5" fill="#ffffff" />
  <path d="M 500 295 Q 515 288 532 295" fill="none" stroke="#2b1a11" stroke-width="3" stroke-linecap="round" />

  <ellipse cx="605" cy="300" rx="14" ry="9" fill="#ffffff" />
  <circle cx="603" cy="300" r="7" fill="#382417" />
  <circle cx="605" cy="298" r="2.5" fill="#ffffff" />
  <path d="M 588 295 Q 605 288 620 295" fill="none" stroke="#2b1a11" stroke-width="3" stroke-linecap="round" />

  <!-- Nose -->
  <path d="M 560 290 L 555 340 Q 562 348 570 340" fill="none" stroke="#d48a63" stroke-width="3.5" stroke-linecap="round" />

  <!-- Big radiant smile with white teeth -->
  <path d="M 515 365 Q 560 375 610 365 Q 615 410 560 410 Q 510 410 515 365 Z" fill="#801a1a" />
  <path d="M 522 368 Q 560 376 602 368 Q 598 390 560 390 Q 525 390 522 368 Z" fill="#ffffff" />
  <!-- Lips -->
  <path d="M 512 365 Q 560 360 612 365 Q 560 375 512 365 Z" fill="#d45b55" />
  <path d="M 518 395 Q 560 415 606 395 Q 560 405 518 395 Z" fill="#c44d47" />

  <!-- Wooden dining table foreground -->
  <polygon points="0,550 1200,530 1200,800 0,800" fill="url(#tableWood)" />
  <line x1="0" y1="550" x2="1200" y2="530" stroke="#5c3822" stroke-width="4" />
  <!-- Wood grain streaks -->
  <line x1="80" y1="620" x2="1140" y2="600" stroke="#1d110a" stroke-width="2" opacity="0.5" />
  <line x1="20" y1="720" x2="1180" y2="700" stroke="#1d110a" stroke-width="2.5" opacity="0.6" />

  <!-- White bowl of rice on the left -->
  <g transform="translate(180, 560)">
    <ellipse cx="60" cy="120" rx="95" ry="30" fill="#0d0806" opacity="0.5" />
    <!-- Ceramic bowl -->
    <path d="M -20 50 C -15 110 30 140 70 140 C 110 140 155 110 160 50 Z" fill="url(#riceBowl)" />
    <!-- Fluffy rice mound -->
    <ellipse cx="70" cy="50" rx="80" ry="25" fill="#fcfcfc" />
    <ellipse cx="65" cy="40" rx="65" ry="20" fill="#ffffff" />
    <circle cx="50" cy="35" r="4" fill="#e8eaed" />
    <circle cx="80" cy="45" r="5" fill="#e8eaed" />
    <circle cx="95" cy="38" r="4" fill="#e8eaed" />
    <!-- Parsley sprig on rice -->
    <path d="M 70 40 Q 60 25 72 15 Q 85 25 70 40 Z" fill="#2d8029" />
    <circle cx="63" cy="22" r="5" fill="#38a633" />
    <circle cx="78" cy="18" r="6" fill="#38a633" />
  </g>

  <!-- The Main Gastronomy Dish: Pineapple stuffed with creamy shrimp (Camarão no Abacaxi) -->
  <g transform="translate(420, 540)">
    <!-- Serving platter underneath -->
    <ellipse cx="250" cy="160" rx="270" ry="60" fill="#0f0907" opacity="0.6" />
    <ellipse cx="250" cy="150" rx="260" ry="50" fill="#f4f6f8" stroke="#d5dbe0" stroke-width="3" />

    <!-- Pineapple crown (leaves pointing left) -->
    <g fill="#4e701a" stroke="#2f4510" stroke-width="1.5">
      <path d="M 60 70 L -60 20 L 40 85 Z" fill="#6d9426" />
      <path d="M 70 60 L -70 50 L 50 80 Z" fill="#54781d" />
      <path d="M 60 85 L -50 80 L 40 95 Z" fill="#7ba32e" />
      <path d="M 50 100 L -30 115 L 60 108 Z" fill="#425f16" />
    </g>

    <!-- Pineapple body shell (halved pineapple, cut open) -->
    <path d="M 50 80 C 100 30 380 30 460 70 C 490 120 480 170 430 190 C 340 210 120 205 60 160 C 30 130 35 100 50 80 Z" fill="url(#pineappleSkin)" stroke="#2b1a07" stroke-width="4" />

    <!-- Pineapple skin texture diamonds -->
    <g stroke="#3a2208" stroke-width="2.5" opacity="0.7">
      <line x1="390" y1="80" x2="470" y2="150" />
      <line x1="360" y1="100" x2="440" y2="180" />
      <line x1="420" y1="70" x2="370" y2="160" />
      <line x1="450" y1="100" x2="410" y2="190" />
    </g>

    <!-- Creamy shrimp filling overflowing rich cheese sauce (Camarão Cremoso) -->
    <path d="M 70 85 C 130 55 350 50 420 80 C 450 115 440 165 390 180 C 310 195 130 195 80 160 C 60 130 60 105 70 85 Z" fill="url(#creamyShrimp)" />
    <!-- Overflowing cream cascade onto the platter -->
    <path d="M 120 160 C 130 190 220 205 270 195 C 230 175 180 165 120 160 Z" fill="#fadc96" />

    <!-- Succulent shrimp silhouettes / textures inside the creamy stew -->
    <!-- Shrimp 1 -->
    <path d="M 140 100 C 150 80 180 85 185 105 C 185 120 165 130 150 125 C 145 115 155 105 165 105" fill="#f27d49" stroke="#d45524" stroke-width="2" />
    <!-- Shrimp 2 -->
    <path d="M 280 90 C 295 70 325 75 330 95 C 330 110 310 120 295 115 C 290 105 300 95 310 95" fill="#f27d49" stroke="#d45524" stroke-width="2" />
    <!-- Shrimp 3 -->
    <path d="M 220 140 C 235 125 260 130 265 145 C 265 160 245 168 230 162" fill="#f27d49" stroke="#d45524" stroke-width="2" />
    <!-- Shrimp 4 -->
    <path d="M 340 135 C 355 120 380 125 385 140 C 385 155 365 162 350 158" fill="#f27d49" stroke="#d45524" stroke-width="2" />
    <!-- Cream highlights -->
    <ellipse cx="210" cy="115" rx="35" ry="12" fill="#fffbe8" opacity="0.8" />
    <ellipse cx="320" cy="110" rx="40" ry="14" fill="#fffbe8" opacity="0.7" />

    <!-- Fresh Green Parsley Sprigs -->
    <g fill="#277a23">
      <circle cx="190" cy="90" r="7" />
      <circle cx="200" cy="85" r="6" />
      <circle cx="195" cy="98" r="6" />
      <circle cx="310" cy="130" r="8" />
      <circle cx="322" cy="125" r="7" />
      <circle cx="315" cy="138" r="7" />
    </g>

    <!-- Carved Tomato Rose in Center -->
    <g transform="translate(240, 75)">
      <circle cx="25" cy="25" r="28" fill="url(#tomatoRose)" />
      <!-- Swirling petals of the tomato skin rose -->
      <path d="M 25 5 C 38 5 48 15 48 25 C 48 38 35 45 25 45 C 12 45 5 35 5 25 C 5 15 15 5 25 5 Z" fill="none" stroke="#ff7b6b" stroke-width="3" />
      <path d="M 25 12 C 32 12 38 18 38 25 C 38 32 32 38 25 38 C 18 38 14 32 14 25" fill="none" stroke="#ffa699" stroke-width="2.5" />
      <circle cx="25" cy="25" r="5" fill="#a8190d" />
      <!-- Green garnish leaf at base of tomato rose -->
      <path d="M 45 35 Q 60 25 65 38 Q 50 48 45 35 Z" fill="#2d8728" />
      <path d="M 5 35 Q -10 25 -15 38 Q 0 48 5 35 Z" fill="#2d8728" />
    </g>

    <!-- Pineapple tail end leaves (pointing right) -->
    <g fill="#4e701a" stroke="#2f4510" stroke-width="1.5">
      <path d="M 460 140 L 530 170 L 450 175 Z" fill="#6d9426" />
      <path d="M 460 110 L 540 130 L 460 135 Z" fill="#54781d" />
    </g>

    <!-- Serving cutlery on plate edge -->
    <path d="M 380 185 L 480 195 L 478 202 L 380 190 Z" fill="#cbd4dc" stroke="#8c9aa6" stroke-width="1" />
  </g>

  <!-- Side plate on right edge -->
  <g transform="translate(980, 560)">
    <ellipse cx="80" cy="120" rx="90" ry="35" fill="#0d0806" opacity="0.4" />
    <ellipse cx="80" cy="110" rx="85" ry="30" fill="#f4f6f8" stroke="#d5dbe0" stroke-width="2" />
    <path d="M 50 90 L 110 135" stroke="#cbd4dc" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Subtle overall ambient vignette & warm restaurant glow -->
  <rect width="1200" height="800" fill="url(#lanternGlow)" opacity="0.18" pointer-events="none" />
</svg>